<!DOCTYPE html>
<html lang="zh-TW" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nano Banana Pro 提示詞工坊 (HTML版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Microsoft JhengHei', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom scrollbar for dark mode */
        .dark ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .dark ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        .dark ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        body {
            transition: background-color 0.3s, color 0.3s;
        }
    </style>

    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
      }
    }
    </script>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <!-- App Container -->
    <div id="app" class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- Header -->
        <header
            class="lg:col-span-12 flex flex-col md:flex-row justify-between items-start md:items-end mb-6 border-b pb-6 dark:border-slate-800 border-gray-200">
            <div class="flex-1">
                <div class="flex items-center gap-4 mb-2">
                    <h1
                        class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-cyan-600 dark:from-indigo-400 dark:to-cyan-400 tracking-tight">
                        Nano Banana Pro
                    </h1>
                    <div
                        class="text-xs px-2 py-1 rounded-full border border-indigo-200 bg-indigo-50 text-indigo-600 dark:border-indigo-500/30 dark:bg-indigo-500/10 dark:text-indigo-300">
                        HTML
                    </div>
                </div>
                <p class="mt-3 text-gray-500 dark:text-slate-400 max-w-3xl text-lg leading-relaxed">
                    Nano Banana Pro 提示詞工程神器。專為高品質影像生成設計。
                </p>
                <div class="flex gap-4 mt-4 text-sm font-medium">
                    <span
                        class="px-3 py-1.5 rounded-full bg-white border border-gray-200 text-gray-600 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300">
                        👨‍💻 By: AI Agent
                    </span>
                </div>
            </div>

            <div class="flex flex-col items-end gap-3 mt-4 md:mt-0">
                <button id="themeToggle"
                    class="p-2 rounded-full bg-white text-slate-600 border border-gray-200 hover:bg-gray-50 dark:bg-slate-800 dark:text-yellow-400 dark:border-slate-700 dark:hover:bg-slate-700 transition-all">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:block"></i>
                </button>

                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key"
                        class="px-4 py-2 rounded-xl border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64">
                </div>
                <div class="flex flex-wrap items-center justify-end gap-3 text-xs text-gray-500 dark:text-slate-400">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" id="rememberApiKey" class="accent-indigo-600">
                        在此瀏覽器保存金鑰
                    </label>
                    <button type="button" id="clearApiKeyBtn" class="text-indigo-600 hover:underline dark:text-indigo-400">清除金鑰</button>
                </div>
                <p id="apiKeyStatus" class="text-xs text-gray-500 dark:text-slate-400" aria-live="polite"></p>
            </div>
        </header>

        <!-- Left Column: Controls -->
        <div class="lg:col-span-5 flex flex-col gap-8">

            <!-- Category Selection -->
            <section>
                <h2
                    class="text-sm uppercase tracking-wider font-bold mb-4 flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
                    <span
                        class="w-6 h-6 rounded flex items-center justify-center text-xs bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20">1</span>
                    選擇功能 / 風格
                </h2>
                <div id="categoryGrid" class="grid grid-cols-2 gap-4">
                    <!-- Categories will be injected here -->
                </div>

                <!-- Sub-options Panel -->
                <div id="optionsPanel"
                    class="mt-6 p-5 rounded-2xl border bg-white border-gray-200 dark:bg-slate-800/50 dark:border-slate-700/50 transition-all duration-300 hidden">
                    <!-- Dynamic Options will be injected here -->
                </div>

                <!-- DEBUG PROMPT PANEL -->
                <div id="debugPromptPanel"
                    class="mt-4 p-3 rounded-xl bg-gray-100 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 text-xs text-gray-500 dark:text-slate-400 font-mono hidden">
                    <div class="flex items-center gap-2 mb-1 text-indigo-500 font-bold uppercase tracking-wider">
                        <i class="fas fa-bug"></i> Prompt Debug
                    </div>
                    <div id="debugPromptText">Hover over a button to see its prompt...</div>
                </div>

                <!-- Aspect Ratio -->
                <div id="aspectRatioSection" class="mt-8 pt-6 border-t border-gray-200 dark:border-slate-700/50">
                    <h2
                        class="text-sm uppercase tracking-wider font-bold mb-4 flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
                        <span
                            class="w-6 h-6 rounded flex items-center justify-center text-xs bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20">📐</span>
                        畫布比例
                    </h2>
                    <div class="grid grid-cols-3 gap-3" id="aspectRatioGrid">
                        <!-- Ratios will be injected here -->
                    </div>
                </div>
            </section>
        </div>

        <!-- Right Column: Input & Output -->
        <div class="lg:col-span-7 flex flex-col gap-6">

            <!-- Input Section -->
            <section>
                <h2
                    class="text-sm uppercase tracking-wider font-bold mb-4 flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
                    <span
                        class="w-6 h-6 rounded flex items-center justify-center text-xs bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20">2</span>
                    輸入描述
                </h2>
                <div class="relative group">
                    <textarea id="userInput"
                        class="w-full h-40 border-2 rounded-2xl p-4 resize-none shadow-inner bg-white border-gray-300 text-gray-900 placeholder-gray-400 focus:border-indigo-400 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100 dark:placeholder-slate-500 dark:focus:border-indigo-500 outline-none transition"
                        placeholder="例如：一個未來的賽博龐克城市夜景..."></textarea>
                    <div id="charCount" class="absolute bottom-4 right-4 text-xs text-gray-400 dark:text-slate-500">0
                        chars</div>
                </div>

                <!-- File Upload Mockup -->
                <div class="mt-4 p-4 rounded-xl border border-dashed border-gray-300 bg-gray-50 dark:border-slate-700 dark:bg-slate-800/30 flex items-center justify-center cursor-pointer hover:border-indigo-400 transition"
                    onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" class="hidden" multiple accept="image/png,image/jpeg,image/webp,application/pdf,text/plain,.txt">
                    <span class="text-sm text-gray-500 dark:text-slate-400 flex items-center gap-2">
                        <i class="fas fa-cloud-upload-alt"></i> 上傳參考檔案 / 圖片
                    </span>
                </div>
                <div id="fileList" class="mt-2 text-xs text-gray-500"></div>
                <p id="fileStatus" class="mt-2 text-xs text-gray-500 dark:text-slate-400" aria-live="polite">支援 PNG、JPG、WebP、PDF、TXT；最多 5 個，單檔 10 MB，總計 12 MB。</p>
            </section>

            <!-- Actions -->
            <div class="flex gap-4">
                <button id="enhanceBtn"
                    class="flex-1 py-4 rounded-xl font-bold text-white bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 shadow-lg shadow-indigo-500/30 transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-magic"></i> 強化提示詞 (Enhance)
                </button>
                <button id="generateBtn"
                    class="flex-1 py-4 rounded-xl font-bold text-white bg-slate-700 hover:bg-slate-600 dark:bg-slate-700 dark:hover:bg-slate-600 transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-image"></i> 生成圖片 (Generate)
                </button>
            </div>
            <p id="requestStatus" class="text-sm text-red-600 dark:text-red-400" role="status" aria-live="polite"></p>

            <!-- Output Section -->
            <section
                class="bg-white border border-gray-200 rounded-2xl p-6 dark:bg-slate-800/50 dark:border-slate-700/50 min-h-[300px] flex flex-col relative">
                <h3 class="text-xs font-bold uppercase text-gray-400 mb-4">Output Result</h3>

                <!-- Loading Overlay -->
                <div id="loadingOverlay"
                    class="absolute inset-0 z-10 bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center hidden">
                    <div
                        class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-3">
                    </div>
                    <span id="loadingText"
                        class="text-sm font-medium text-indigo-600 dark:text-indigo-400 animate-pulse">Processing...</span>
                </div>

                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-gray-500 font-medium">Enhanced Prompt</span>
                            <div class="flex items-center gap-2">
                                <span id="copyStatus" class="text-xs text-gray-500 dark:text-slate-400" aria-live="polite"></span>
                                <button id="copyBtn" type="button" class="text-xs text-indigo-500 hover:underline">複製</button>
                            </div>
                        </div>
                        <div id="promptOutput"
                            class="p-4 rounded-xl bg-gray-50 text-gray-700 text-sm leading-relaxed border border-gray-200 dark:bg-slate-900 dark:text-slate-300 dark:border-slate-700 min-h-[100px] whitespace-pre-wrap">
                        </div>
                    </div>

                    <div id="imagePreview"
                        class="rounded-xl overflow-hidden bg-black/5 min-h-[200px] flex items-center justify-center border border-gray-200 dark:border-slate-700 dark:bg-black/20">
                        <span class="text-gray-400 text-sm">Image Preview</span>
                    </div>
                    <a id="downloadImageBtn" class="hidden mt-3 inline-flex items-center gap-2 text-sm text-indigo-600 hover:underline dark:text-indigo-400" download>
                        <i class="fas fa-download"></i> 下載圖片
                    </a>
                </div>
            </section>

        </div>
    </div>

    <!-- MAIN SCRIPT -->
    <script type="module">
        import { GoogleGenAI } from "@google/genai";
        import { buildAttachmentParts, processAttachments, validateAttachmentFiles } from "./attachments.mjs";
        import { clearStoredApiKey, loadStoredApiKey, persistApiKey } from "./api-key-storage.mjs";
        import { CATEGORY_OPTIONS, CATEGORY_OPTION_DEFAULTS, getCategoryInstructions } from "./category-options.mjs";
        import { copyPromptText } from "./clipboard.mjs";
        import { extractGeneratedImage, toImageDataUrl } from "./image-response.mjs";
        import { createRequestController, getRequestErrorMessage } from "./request-feedback.mjs";

        // ==========================================
        // 1. DATA MODELS & CONSTANTS
        // ==========================================
        const CATEGORIES = [
            { id: 'MANGA', label: '日系漫畫', icon: '✒️', desc: '分鏡、線條張力', baseSystemPrompt: `You are an expert prompt engineer for Nano Banana Pro... specializing in Manga/Anime styles. Convert user input into highly technical prompt in Traditional Chinese.` },
            { id: 'LINE_STICKER', label: 'LINE 貼圖', icon: '😊', desc: '表情包、無白邊', baseSystemPrompt: `You are an expert prompt engineer for Nano Banana Pro... specializing in LINE Sticker creation. CRITICAL RULES: NO WHITE BORDERS...` },
            { id: 'INSTRUCTION_MANUAL', label: '說明書', icon: '📖', desc: '步驟圖解、分解圖', baseSystemPrompt: `You are an expert... specializing in Instructional Design...` },
            { id: 'ADVERTISEMENT', label: '商業廣告', icon: '🛍️', desc: '產品攝影、手模', baseSystemPrompt: `You are an expert... specializing in Commercial Product Photography...` },
            { id: 'COPYWRITING', label: '文案小幫手', icon: '✍️', desc: '社群、廣告文案', baseSystemPrompt: `You are a professional Traditional Chinese Copywriter...` },
            { id: 'POSTER', label: '海報設計', icon: '🪧', desc: '電影、活動宣傳', baseSystemPrompt: `You are an expert... specializing in Graphic Design and Poster Art...` },
            { id: 'BUSINESS_CARD', label: '名片設計', icon: '📇', desc: '排版、質感模擬', baseSystemPrompt: `You are an expert... specializing in Branding...` },
            { id: 'ID_PHOTO', label: '證件照', icon: '🆔', desc: '1吋/2吋、排版', baseSystemPrompt: `You are an expert... specializing in Professional ID Photos...` },
            { id: 'PHOTOREALISTIC', label: '寫實攝影', icon: '📸', desc: '8K、光影細節', baseSystemPrompt: `You are an expert... specializing in Photorealism...` },
            { id: 'CINEMATIC_3D', label: '3D 電影級', icon: '🧊', desc: '皮克斯、寫實渲染', baseSystemPrompt: `You are an expert... specializing in 3D Rendering...` },
            { id: 'DIGITAL_ART', label: '數位繪畫', icon: '🎨', desc: '油畫、概念藝術', baseSystemPrompt: `You are an expert... specializing in Digital Painting...` },
            { id: 'LOGO_DESIGN', label: 'Logo 設計', icon: '💠', desc: '向量、極簡風格', baseSystemPrompt: `You are an expert... specializing in Vector and Logo design...` },
            { id: 'PIXEL_ART', label: '像素藝術', icon: '👾', desc: '復古遊戲風格', baseSystemPrompt: `You are an expert... specializing in Pixel Art...` }

        ];

        // ==========================================
        // 2. STATE MANAGEMENT
        // ==========================================
        const state = {
            selectedCategoryId: 'MANGA',
            inputs: {
                userText: '',
                files: []
            },
            options: {
                ...CATEGORY_OPTION_DEFAULTS,
                aspectRatio: '1:1'
            },
            apiKey: loadStoredApiKey()
        };

        if (state.apiKey) {
            document.getElementById('apiKeyInput').value = state.apiKey;
            document.getElementById('rememberApiKey').checked = true;
            document.getElementById('apiKeyStatus').innerText = '正在使用此瀏覽器已保存的金鑰。';
        }

        // ==========================================
        // 3. SERVICE LAYER (Gemini Logic)
        // ==========================================
        const getAiClient = () => {
            if (!state.apiKey) throw new Error("Please enter API Key");
            return new GoogleGenAI({ apiKey: state.apiKey });
        };

        const extractText = (response) => {
            if (!response) return "";

            // 1. Try standard candidates array (Raw JSON or some SDKs)
            if (response.candidates && Array.isArray(response.candidates) && response.candidates.length > 0) {
                const first = response.candidates[0];
                if (first.content && first.content.parts && Array.isArray(first.content.parts) && first.content.parts.length > 0) {
                    return first.content.parts[0].text || "";
                }
            }

            // 2. Try .text() function (Standard GoogleGenAI SDK)
            if (typeof response.text === 'function') {
                return response.text();
            }

            // 3. Try .text property (some mocks or alternative SDKs)
            if (typeof response.text === 'string') {
                return response.text;
            }

            return "";
        };

        const enhancePrompt = async () => {
            const ai = getAiClient();
            // List of models to try
            // 強化提示詞，目前測試只有 gemini-2.5-flash 可以正常執行
            const modelsToTry = ["gemini-2.5-flash"];

            const cat = CATEGORIES.find(c => c.id === state.selectedCategoryId);

            const categoryInstruction = getCategoryInstructions(state.selectedCategoryId, state.options);

            // System Construct
            const systemInstruction = `
                ${cat.baseSystemPrompt}
                ${categoryInstruction}
                構圖比例: ${state.options.aspectRatio}
                IMPORTANT: Return ONLY the optimized Traditional Chinese prompt text.
             `;

            // Content Parts
            const parts = [{ text: state.inputs.userText || "主體不明，請自由發揮" }];
            parts.push(...buildAttachmentParts(state.inputs.files));

            // Try Models Loop
            let lastError = null;
            for (const modelId of modelsToTry) {
                try {
                    // Note: GoogleGenAI SDK usage
                    const response = await ai.models.generateContent({
                        model: modelId,
                        contents: { parts: parts }, // Assuming SDK accepts this structure 
                        config: { systemInstruction: systemInstruction }
                    });

                    // Check for standard text output in new SDK
                    return extractText(response);
                } catch (err) {
                    lastError = err;
                    continue; // Try next optional model
                }
            }
            throw lastError || new Error("All models failed.");
        };

        const generateImage = async (prompt) => {
            const ai = getAiClient();
            // 用 Nano Banana Pro 生成圖片要用 gemini-3-pro-image-preview，目前 AI Studio 申請的 API Key 只能用 gemini-2.5-flash，要綁信用卡才能用 gemini-3-pro-image-preview
            const modelId = "gemini-3-pro-image-preview";

            const response = await ai.models.generateContent({
                model: modelId,
                contents: { parts: [{ text: "Generate an image: " + prompt }] },
                config: {
                    responseModalities: ['IMAGE'],
                    imageConfig: { aspectRatio: state.options.aspectRatio }
                }
            });
            return extractGeneratedImage(response);
        };

        // ==========================================
        // 4. UI RENDERING & INTERACTION
        // ==========================================

        // Render Categories
        const renderCategories = () => {
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = CATEGORIES.map(cat => `
                <div data-id="${cat.id}" class="category-card cursor-pointer p-4 rounded-xl border transition-all flex flex-col gap-2 
                    ${state.selectedCategoryId === cat.id
                    ? 'border-indigo-500 bg-indigo-50 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300'
                    : 'border-gray-200 bg-white hover:border-indigo-300 dark:bg-slate-800 dark:border-slate-700 dark:hover:border-slate-500'}">
                    <div class="text-3xl">${cat.icon}</div>
                    <div class="font-bold text-sm">${cat.label}</div>
                    <div class="text-xs opacity-60 line-clamp-1">${cat.desc}</div>
                </div>
            `).join('');

            // Add Click Listeners
            document.querySelectorAll('.category-card').forEach(card => {
                card.addEventListener('click', () => {
                    state.selectedCategoryId = card.dataset.id;
                    renderCategories();
                    renderOptionControls();
                });
            });
        };

        // Render Options (Dynamic)
        const renderOptionControls = () => {
            const panel = document.getElementById('optionsPanel');
            const debugPanel = document.getElementById('debugPromptPanel');
            const groups = CATEGORY_OPTIONS[state.selectedCategoryId] || [];
            const controlsHtml = groups.map((group) => `
                <div class="mb-4">
                    <h3 class="text-xs font-bold mb-2 text-indigo-500">${group.title}</h3>
                    <div class="flex flex-wrap gap-2">
                        ${group.options.map((option) => {
                            const safePrompt = option.prompt.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                            return `
                                <button type="button" onclick="window.updateOption('${group.key}', '${option.value}')"
                                    onmouseenter="window.showDebugPrompt('${safePrompt}')"
                                    onmouseleave="window.showDebugPrompt('')"
                                    class="px-3 py-1.5 rounded-lg text-sm border transition-all
                                    ${state.options[group.key] === option.value
                                        ? 'bg-indigo-600 text-white border-indigo-600'
                                        : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50 dark:bg-slate-700 dark:border-slate-600 dark:text-slate-300'}">
                                    ${option.label}
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');

            if (controlsHtml) {
                panel.innerHTML = controlsHtml;
                panel.classList.remove('hidden');
                if (debugPanel) debugPanel.classList.remove('hidden');
            } else {
                panel.classList.add('hidden');
                if (debugPanel) debugPanel.classList.add('hidden');
            }
        };

        // Debug Prompt Handler
        window.showDebugPrompt = (text) => {
            const el = document.getElementById('debugPromptText');
            if (!el) return;
            if (text) {
                el.innerText = text;
                el.parentElement.classList.add('bg-indigo-50', 'dark:bg-indigo-900/20');
            } else {
                el.innerText = "Hover over a button to see its prompt...";
                el.parentElement.classList.remove('bg-indigo-50', 'dark:bg-indigo-900/20');
            }
        };

        // Render Aspect Ratios
        const renderRatios = () => {
            const grid = document.getElementById('aspectRatioGrid');
            const ratios = ['1:1', '3:4', '4:3', '9:16', '16:9'];
            grid.innerHTML = ratios.map(r => `
                <button onclick="window.updateOption('aspectRatio', '${r}')"
                    class="flex flex-col items-center justify-center p-3 rounded-xl border-2 transition-all gap-2
                    ${state.options.aspectRatio === r
                    ? 'border-indigo-500 bg-indigo-500/10 text-indigo-500'
                    : 'border-gray-200 bg-white hover:bg-gray-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-400'}">
                    <span class="text-xs font-bold">${r}</span>
                </button>
            `).join('');
        };

        // Global Updater for inline onclicks
        window.updateOption = (key, val) => {
            state.options[key] = val;
            renderOptionControls(); // Re-render for active states
            renderRatios();
        };

        // ==========================================
        // 5. INITIALIZATION & HANDLERS
        // ==========================================

        // Listeners
        const requestButtons = [document.getElementById('enhanceBtn'), document.getElementById('generateBtn')];
        const requestOverlay = document.getElementById('loadingOverlay');
        const requestStatus = document.getElementById('requestStatus');
        const requestController = createRequestController((busy, label) => {
            requestButtons.forEach((button) => {
                button.disabled = busy;
                button.classList.toggle('opacity-60', busy);
                button.classList.toggle('cursor-not-allowed', busy);
            });
            requestOverlay.classList.toggle('hidden', !busy);
            if (busy) {
                document.getElementById('loadingText').innerText = label;
                requestStatus.innerText = '';
            }
        });

        document.getElementById('apiKeyInput').addEventListener('change', (e) => {
            state.apiKey = e.target.value;
            const remembered = document.getElementById('rememberApiKey').checked;
            const saved = persistApiKey(state.apiKey, remembered);
            document.getElementById('apiKeyStatus').innerText = saved
                ? (remembered && state.apiKey ? '金鑰已保存於此瀏覽器。' : '金鑰只保留在目前頁面。')
                : '瀏覽器不允許保存金鑰；目前仍可在此頁面使用。';
        });

        document.getElementById('copyBtn').addEventListener('click', async () => {
            const output = document.getElementById('promptOutput').textContent;
            const copied = await copyPromptText(output);
            document.getElementById('copyStatus').innerText = copied
                ? '已複製提示詞。'
                : (output.trim() ? '複製失敗，請手動選取提示詞。' : '目前沒有可複製的提示詞。');
        });

        document.getElementById('rememberApiKey').addEventListener('change', (e) => {
            const saved = persistApiKey(state.apiKey, e.target.checked);
            document.getElementById('apiKeyStatus').innerText = saved
                ? (e.target.checked ? '已保存目前金鑰於此瀏覽器。' : '已移除保存的金鑰；目前頁面仍可使用。')
                : '無法更新瀏覽器中的金鑰保存狀態。';
        });

        document.getElementById('clearApiKeyBtn').addEventListener('click', () => {
            const cleared = clearStoredApiKey();
            state.apiKey = '';
            document.getElementById('apiKeyInput').value = '';
            document.getElementById('rememberApiKey').checked = false;
            document.getElementById('apiKeyStatus').innerText = cleared
                ? '已清除目前輸入及瀏覽器保存的金鑰。'
                : '目前輸入已清除，但瀏覽器無法確認保存金鑰已移除。';
        });

        document.getElementById('userInput').addEventListener('input', (e) => {
            state.inputs.userText = e.target.value;
            document.getElementById('charCount').innerText = `${e.target.value.length} chars`;
        });

        const renderFileList = () => {
            const fileListEl = document.getElementById('fileList');
            fileListEl.innerHTML = state.inputs.files.map((file, index) => `
                <div class="flex items-center gap-2 mb-2 p-3 rounded-xl bg-white dark:bg-slate-700/50 border border-gray-200 dark:border-slate-600">
                    <span class="text-indigo-500">📎</span>
                    <span class="truncate flex-1">${file.name} (${(file.size / 1024).toFixed(1)} KB)</span>
                    <button type="button" data-remove-file="${index}" class="text-indigo-600 hover:underline dark:text-indigo-400">移除</button>
                </div>
            `).join('');
        };

        document.getElementById('fileList').addEventListener('click', (e) => {
            const removeButton = e.target.closest('[data-remove-file]');
            if (!removeButton) return;
            state.inputs.files.splice(Number(removeButton.dataset.removeFile), 1);
            renderFileList();
            document.getElementById('fileStatus').innerText = '已移除附件。';
        });

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            e.target.value = '';
            if (files.length === 0) return;

            const validation = validateAttachmentFiles(files, state.inputs.files);
            const status = document.getElementById('fileStatus');
            if (!validation.valid) {
                status.innerText = validation.error;
                return;
            }

            try {
                e.target.disabled = true;
                status.innerText = '正在讀取附件…';
                const processed = await processAttachments(files);
                state.inputs.files.push(...processed);
                renderFileList();
                status.innerText = `已加入 ${files.length} 個附件。`;
            } catch (err) {
                status.innerText = `讀取附件失敗：${err.message}`;
            } finally {
                e.target.disabled = false;
            }
        });

        document.getElementById('enhanceBtn').addEventListener('click', async () => {
            const output = document.getElementById('promptOutput');
            if (!requestController.begin('Enhancing Prompt with AI Agent...')) return;

            try {
                const result = await enhancePrompt();
                output.innerText = result;
            } catch (err) {
                requestStatus.innerText = getRequestErrorMessage(err, 'prompt');
            } finally {
                requestController.finish();
            }
        });

        // Generate Image Handler
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const previewContainer = document.getElementById('imagePreview');
            const downloadButton = document.getElementById('downloadImageBtn');
            // Prefer the enhanced prompt if available and valid
            let prompt = document.getElementById('promptOutput').innerText;
            if (!prompt || prompt.includes("Error") || prompt.length < 5) {
                prompt = state.inputs.userText;
            }

            if (!prompt) {
                requestStatus.innerText = '請先輸入描述或產生提示詞。';
                return;
            }
            if (!requestController.begin('Generating Image...')) return;

            try {
                previewContainer.replaceChildren(Object.assign(document.createElement('span'), {
                    className: 'text-gray-400 text-sm',
                    textContent: 'Generating...'
                }));
                downloadButton.classList.add('hidden');

                const image = await generateImage(prompt);

                if (image) {
                    const imageUrl = toImageDataUrl(image);
                    const preview = document.createElement('img');
                    preview.src = imageUrl;
                    preview.className = 'w-full h-full object-contain';
                    preview.alt = 'Generated image';
                    previewContainer.replaceChildren(preview);

                    const extension = image.mimeType === 'image/jpeg' ? 'jpg' : image.mimeType.split('/')[1];
                    downloadButton.href = imageUrl;
                    downloadButton.download = `nano-banana-${Date.now()}.${extension}`;
                    downloadButton.classList.remove('hidden');
                } else {
                    previewContainer.replaceChildren(Object.assign(document.createElement('span'), {
                        className: 'text-red-500 text-sm',
                        textContent: '模型沒有回傳可顯示的圖片。'
                    }));
                }

            } catch (err) {
                requestStatus.innerText = getRequestErrorMessage(err, 'image');
                previewContainer.replaceChildren(Object.assign(document.createElement('span'), {
                    className: 'text-red-500 text-sm',
                    textContent: '圖片生成失敗。'
                }));
            } finally {
                requestController.finish();
            }
        });

        // Theme Toggle
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            state.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        });

        // Init
        renderCategories();
        renderOptionControls();
        renderRatios();

    </script>
</body>

</html>
